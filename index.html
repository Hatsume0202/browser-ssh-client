<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrowserSSH — 浏览器 SSH 客户端</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/terminal-theme.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🖥️ BrowserSSH</h1>
      <span class="header-subtitle">浏览器 SSH 客户端</span>
      <div class="header-spacer"></div>
      <div class="header-actions">
        <button id="demo-btn" class="demo-btn" title="无需 SSH 服务器，直接体验终端">🚀 演示模式</button>
      </div>
    </header>
    <main>
      <!-- 左侧连接面板 -->
      <section id="connection-panel">
        <!-- 最近连接 -->
        <div class="form-group">
          <label for="connection-history">最近连接</label>
          <select id="connection-history">
            <option value="" disabled selected>📋 最近连接...</option>
          </select>
        </div>
        <form id="connection-form">
          <div class="form-group">
            <label for="host">主机地址 (Host)</label>
            <input type="text" id="host" placeholder="example.com 或 192.168.1.100" required>
          </div>
          <div class="form-group">
            <label for="port">端口 (Port)</label>
            <input type="number" id="port" value="22" min="1" max="65535" required>
          </div>
          <div class="form-group">
            <label for="username">用户名 (Username)</label>
            <input type="text" id="username" placeholder="root" required>
          </div>
          <div class="form-group">
            <label for="auth-type">认证方式</label>
            <select id="auth-type">
              <option value="password">密码认证</option>
              <option value="key">私钥认证</option>
            </select>
          </div>
          <div class="form-group" id="password-group">
            <label for="password">密码 (Password)</label>
            <input type="password" id="password" placeholder="输入 SSH 密码">
          </div>
          <div class="form-group" id="key-group" style="display:none">
            <label for="private-key">私钥 (Private Key)</label>
            <textarea id="private-key" rows="5" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----\n..."></textarea>
          </div>
          <div class="form-group">
            <label for="ws-url">代理地址 (WebSocket URL) [可选]</label>
            <input type="text" id="ws-url" placeholder="ws://localhost:3000/ws" value="">
            <span style="font-size:11px;color:var(--text-secondary);">留空则自动进入演示模式</span>
          </div>
          <div class="button-group">
            <button type="submit" id="connect-btn">🔗 连接</button>
            <button type="button" id="disconnect-btn" disabled>⏹️ 断开</button>
          </div>
        </form>
        <div id="status-bar" class="status-bar">
          <span id="connection-status" class="status-disconnected">⏹️ 未连接</span>
          <span id="session-info" class="session-info"></span>
        </div>
      </section>
      <!-- 右侧终端区域 -->
      <section id="terminal-container" style="display:none">
        <div class="terminal-toolbar">
          <span id="terminal-title">📟 终端</span>
          <span id="terminal-status-indicator" class="status-dot disconnected"></span>
        </div>
        <div id="terminal"></div>
      </section>
    </main>
  </div>
  <!-- 外部库 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <!-- 应用脚本 (按依赖顺序) -->
  <script src="js/websocket-client.js"></script>
  <script src="js/terminal-ui.js"></script>
  <script src="js/connection-form.js"></script>
  <script src="js/simulated-shell.js"></script>
  <script src="js/ssh-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
